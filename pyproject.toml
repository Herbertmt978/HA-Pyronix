[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/pyronix_homecontrol"]

[[tool.mypy.overrides]]
# Home Assistant packages re-export implicitly; strictness applies to this integration.
module = "homeassistant.*"
implicit_reexport = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Home Assistant Core's rule selection, so the integration reads like Core code.
select = [
  "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004", "DTZ011", "E", "F",
  "FLY", "FURB", "G", "I", "INP", "ISC", "ICN001", "ICN002", "LOG", "N804", "N805", "N806",
  "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "S102", "S103",
  "S107", "S108", "S301", "S306", "S307", "S313", "S314", "S315", "S316", "S317", "S318",
  "S319", "S601", "S602", "S604", "S608", "S609", "SIM", "SLF", "SLOT", "T100", "T20", "TC",
  "TID", "TRY", "UP", "W",
]
ignore = [
  "D202", "D203", "D213", "D406", "D407", "D417", "E501", "PLC1901", "PLR0911", "PLR0912",
  "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0108", "PLW2901", "PT011", "PT018",
  "RUF001", "RUF012", "SIM102", "SIM103", "SIM108", "TC001", "TC002", "TC003", "TRY003",
  "COM812",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant", "tests", "tools"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Not needed; Home Assistant requires Python 3.14"
"async_timeout".msg = "use asyncio.timeout instead"
"voluptuous".msg = "use probatio instead"

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests exercise private session state directly; the setup helper is a CLI.
"tests/*.py" = ["D", "SLF001"]
"tools/*.py" = ["D1", "T201"]

[tool.ruff.per-file-target-version]
"tools/*.py" = "py311"
