[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.per-file-target-version]
"tools/*.py" = "py311"

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E501"]
"tests/*.py" = ["E501"]
